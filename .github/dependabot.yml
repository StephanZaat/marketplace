# Standard config (all StephanZaat repos): daily check, minor+patch grouped into one PR per
# ecosystem, majors as separate PRs, 3-day cooldown so brand-new releases settle first.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Aruba"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Aruba"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Aruba"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # odd Node majors never become LTS
      - dependency-name: "node"
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Aruba"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      dockercompose-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # odd Node majors never become LTS
      - dependency-name: "node"
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Aruba"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      githubactions-minor-patch:
        update-types: ["minor", "patch"]
